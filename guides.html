<head>
    <script>window.SITE_URL=window.location.origin;if(location.pathname.startsWith('/en')){var b=document.createElement('base');b.href='/';document.head.appendChild(b);}(function(){try{var s=localStorage.getItem('theme');var d=(s==='dark')||(!s&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);if(d){document.documentElement.setAttribute('data-theme','dark');}}catch(_e){}})();function toggleTheme(){try{var h=document.documentElement;var d=h.getAttribute('data-theme')==='dark';if(d){h.removeAttribute('data-theme');localStorage.setItem('theme','light');}else{h.setAttribute('data-theme','dark');localStorage.setItem('theme','dark');}var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',d?'#1e5631':'#22272e');}catch(_e){}}</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;700;800&family=Noto+Sans+Bengali:wght@400;500;700&display=optional"></noscript>
    <link rel="preconnect" href="https://flagcdn.com" crossorigin>

    <link rel="icon" type="image/png" sizes="16x16" href="/assets/brand/favicon-16x16.png?v=1">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32x32.png?v=1">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/brand/apple-touch-icon.png?v=1">
    <link rel="stylesheet" href="css/style.css?v=502">
    <style>
        /* ADSENSE-EDITORIAL-GUIDES-IMPLEMENTATION-1: long-form editorial layout.
           Scoped to .guide-* so nothing here can reach any other page. Mobile-first;
           the desktop reading measure is applied at >=768px only. Logical properties
           throughout (inline-start/end) so RTL and LTR both lay out correctly with no
           direction-specific overrides. */
        .guide-wrap {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px 18px 30px;
            box-shadow: var(--shadow);
            line-height: 1.95;
            font-size: 1.02rem;
        }
        .guide-wrap h1 {
            color: var(--primary-dark);
            margin: 0 0 6px;
            font-size: 1.55rem;
            line-height: 1.45;
            letter-spacing: -0.01em;
        }
        .guide-eyebrow {
            display: inline-block;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--primary);
            background: color-mix(in srgb, var(--primary) 10%, transparent);
            border-radius: 999px;
            padding: 4px 12px;
            margin: 0 0 14px;
            letter-spacing: 0.02em;
        }
        .guide-intro {
            font-size: 1.1rem;
            line-height: 1.9;
            color: var(--text);
            border-inline-start: 3px solid var(--primary);
            padding-inline-start: 14px;
            margin: 0 0 26px;
        }
        .guide-wrap h2 {
            color: var(--primary-dark);
            margin: 34px 0 10px;
            font-size: 1.28rem;
            line-height: 1.5;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }
        .guide-wrap h3 {
            color: var(--primary);
            margin: 22px 0 8px;
            font-size: 1.06rem;
            line-height: 1.55;
        }
        .guide-wrap p { margin: 0 0 15px; }
        .guide-wrap ul, .guide-wrap ol { margin: 0 0 16px; padding-inline-start: 22px; }
        .guide-wrap li { margin-bottom: 8px; }
        .guide-wrap strong { color: var(--primary-dark); font-weight: 700; }
        .guide-wrap a { color: var(--primary); text-decoration: underline; text-underline-offset: 3px; }
        .guide-wrap a:hover { color: var(--primary-dark); }

        /* Tables scroll inside their own container — the page never scrolls sideways. */
        .guide-table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 6px 0 20px;
            border: 1px solid var(--border);
            border-radius: 10px;
        }
        .guide-table-wrap table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.94rem;
            min-width: 340px;
        }
        .guide-table-wrap th, .guide-table-wrap td {
            padding: 9px 12px;
            text-align: start;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        .guide-table-wrap thead th {
            background: color-mix(in srgb, var(--primary) 8%, transparent);
            color: var(--primary-dark);
            font-weight: 700;
            position: sticky;
            top: 0;
        }
        .guide-table-wrap tbody tr:last-child td { border-bottom: none; }

        .guide-formula {
            background: color-mix(in srgb, var(--primary) 6%, transparent);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            margin: 6px 0 18px;
            overflow-x: auto;
            direction: ltr;
            text-align: left;
        }
        .guide-formula code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.93rem;
            line-height: 1.85;
            white-space: pre;
        }
        .guide-wrap code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.92em;
        }

        .guide-sources {
            margin-top: 38px;
            padding: 18px 18px 6px;
            background: color-mix(in srgb, var(--primary) 5%, transparent);
            border: 1px solid var(--border);
            border-radius: 12px;
        }
        .guide-sources h2 { margin-top: 0; border-bottom: none; padding-bottom: 0; font-size: 1.15rem; }
        .guide-sources-note { font-size: 0.94rem; opacity: 0.88; }
        .guide-sources ul { padding-inline-start: 20px; }
        .guide-sources li { margin-bottom: 9px; font-size: 0.96rem; }

        .guide-related { margin-top: 30px; }
        .guide-related h2 { font-size: 1.15rem; }
        .guide-related-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
        .guide-related-list a {
            display: block;
            padding: 13px 16px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            text-decoration: none;
            color: var(--primary-dark);
            font-weight: 600;
            transition: border-color .15s ease, transform .15s ease;
        }
        .guide-related-list a:hover { border-color: var(--primary); transform: translateY(-1px); }

        /* ADSENSE-EDITORIAL-GUIDES-HUB-1: the section landing page. Editorial cards, not a link
           list -- each carries a title, a real description and its own call to action. Logical
           properties so RTL and LTR both work with no direction-specific overrides. */
        .guide-hub-section { margin-top: 34px; }
        .guide-hub-lead { opacity: 0.9; margin: 0 0 16px; }
        .guide-hub-cards { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
        .guide-hub-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-inline-start: 3px solid var(--primary);
            border-radius: 12px;
            padding: 18px 20px;
            margin: 0;
        }
        .guide-hub-card h3 { margin: 0 0 8px; font-size: 1.08rem; line-height: 1.55; }
        .guide-hub-card h3 a { color: var(--primary-dark); text-decoration: none; }
        .guide-hub-card h3 a:hover { text-decoration: underline; text-underline-offset: 3px; }
        .guide-hub-card p { margin: 0 0 12px; font-size: 0.97rem; line-height: 1.85; }
        .guide-hub-cta {
            display: inline-block;
            font-weight: 700;
            font-size: 0.94rem;
            color: var(--primary);
            text-decoration: none;
        }
        .guide-hub-cta::after { content: " ←"; }
        html[dir="ltr"] .guide-hub-cta::after { content: " →"; }
        .guide-hub-cta:hover { text-decoration: underline; text-underline-offset: 3px; }
        .guide-hub-editorial { margin-top: 36px; }

        @media (min-width: 768px) {
            .guide-wrap { padding: 34px 40px 42px; max-width: 74ch; margin-inline: auto; }
            .guide-wrap h1 { font-size: 1.95rem; }
            .guide-wrap h2 { font-size: 1.4rem; }
            .guide-table-wrap th, .guide-table-wrap td { padding: 10px 14px; }
            .guide-related-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .guide-hub-card { padding: 20px 24px; }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- ========= الشريط الجانبي ========= -->
        <!--SHARED-SIDEBAR-->

        <!-- ========= المحتوى الرئيسي ========= -->
        <main class="main-content">
            <!--SHARED-HEADER-->

            <article class="guide-wrap">
                {{GUIDE_CONTENT}}
            </article>

            <!--SHARED-FOOTER-->
        </main>
    </div>

    <script src="js/i18n.js?v=132"></script>
    <script defer src="js/footer-cookie.js?v=8"></script>
    <script>
        document.getElementById('footer-year').textContent = new Date().getFullYear();

        /* ===== goHome (locale-aware) ===== */
        function goHome() {
            const l = (typeof getCurrentLang === 'function') ? getCurrentLang() : 'ar';
            window.location.href = (l === 'ar') ? '/' : ('/' + l + '/');
        }
        /* ===== Stub functions للبحث/الموقع — تعيد التوجيه للرئيسية (locale-aware) ===== */
        function _homePrefix() {
            const l = (typeof getCurrentLang === 'function') ? getCurrentLang() : 'ar';
            return (l === 'ar') ? '' : ('/' + l);
        }
        function onCitySearchInput(q) {
            if (q && q.trim().length >= 2) window.location.href = _homePrefix() + '/?search=' + encodeURIComponent(q.trim());
        }
        function onSearchKeyDown(e) {
            if (e.key === 'Enter' && e.target.value.trim()) window.location.href = _homePrefix() + '/?search=' + encodeURIComponent(e.target.value.trim());
        }
        function detectLocation() { window.location.href = _homePrefix() + '/?detect=1'; }
        // i18n.js يتولّى تهيئة مُبدّل اللغة (الأعلام + القائمة) عبر setLanguage
    </script>
</body>
</html>
