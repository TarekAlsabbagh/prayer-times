    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/brand/favicon-16x16.png?v=1">

    <style>
        .legal-wrap {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px 30px;
            box-shadow: var(--shadow);
            line-height: 1.85;
        }
        .legal-wrap h1 {
            color: var(--primary-dark);
            margin: 0 0 8px;
            font-size: 1.75rem;
        }
        .legal-wrap h2 {
            color: var(--primary);
            margin: 28px 0 10px;
            font-size: 1.2rem;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 6px;
        }
        .legal-wrap h3 { font-size: 1rem; margin: 18px 0 6px; color: var(--text); }
        .legal-wrap p, .legal-wrap li { color: var(--text); font-size: 0.95rem; }
        .legal-wrap ul, .legal-wrap ol { padding-inline-start: 22px; }
        .legal-wrap a { color: var(--primary); text-decoration: underline; }
        .legal-meta {
            display: inline-block;
            background: rgba(0,0,0,0.04);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
            color: var(--text-light);
            margin-bottom: 12px;
        }
        .contact-card {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: #fff;
            border-radius: 12px;
            padding: 18px 22px;
            margin: 18px 0;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .contact-card a { color: #fff; font-weight: 700; }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- ========= الشريط الجانبي ========= -->
        <!--SHARED-SIDEBAR-->

        <!-- ========= المحتوى الرئيسي ========= -->
        <main class="main-content">
            <!--SHARED-HEADER-->

            <article class="legal-wrap">
                {{LEGAL_CONTENT}}
            </article>

            <!--SHARED-FOOTER-->
        </main>
    </div>

    <script src="js/i18n.js?v=132"></script>
    <script defer src="js/footer-cookie.js?v=8"></script>
    <script>
        document.getElementById('footer-year').textContent = new Date().getFullYear();

        /* ===== goHome (locale-aware) ===== */
        function goHome() {
            const l = (typeof getCurrentLang === 'function') ? getCurrentLang() : 'ar';
            window.location.href = (l === 'ar') ? '/' : ('/' + l + '/');
        }
        /* ===== Stub functions للبحث/الموقع — تعيد التوجيه للرئيسية (locale-aware) ===== */
        function _homePrefix() {
            const l = (typeof getCurrentLang === 'function') ? getCurrentLang() : 'ar';
            return (l === 'ar') ? '' : ('/' + l);
        }
        function onCitySearchInput(q) {
            if (q && q.trim().length >= 2) window.location.href = _homePrefix() + '/?search=' + encodeURIComponent(q.trim());
        }
        function onSearchKeyDown(e) {
            if (e.key === 'Enter' && e.target.value.trim()) window.location.href = _homePrefix() + '/?search=' + encodeURIComponent(e.target.value.trim());
        }
        function detectLocation() { window.location.href = _homePrefix() + '/?detect=1'; }
        // i18n.js يتولّى تهيئة مُبدّل اللغة (الأعلام + القائمة) عبر setLanguage
    </script>
</body>
</html>
